<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2</title>
    <style> 
        body {background-color: rgb(255, 198, 226)}
    </style>
    <link rel="stylesheet" href="style_practica.css">
</head>
<body> 
    <h1> 
        Biblioteca Personal
    </h1>
    <form id="form-libro">
        <input type="text" id="titulo" placeholder="Título" required />
        <input type="text" id="autor" placeholder="Autor" required />
        <input type="number" id="año" placeholder="Año" required />
        <input type="text" id="genero" placeholder="Género" required />
    
        <label>
        <input type="checkbox" id="leido" />
        Leído
        </label>

        <button type="submit">Agregar libro</button>

    </form>

    <div class="filtros">
      <input type="text" id="busqueda" placeholder="Buscar por título o autor" />
      <select id="filtro-genero">
        <option value="">Todos los géneros</option>
      </select>
      <input type="number" id="anio-inicio" placeholder="Año inicio" />
      <input type="number" id="anio-fin" placeholder="Año fin" />
      <select id="ordenar-por">
        <option value="titulo">Ordenar por título</option>
        <option value="autor">Ordenar por autor</option>
        <option value="año">Ordenar por año</option>
      </select>
      <select id="orden-asc-desc">
        <option value="asc">Ascendente</option>
        <option value="desc">Descendente</option>
      </select>
    </div>

    <div class="stats" id="estadisticas"></div>

    <ul id="lista-libros"></ul>

    <div class="group-box">
      <h2>Libros agrupados por género</h2>
      <div id="grupo-generos"></div>
    </div>
    </div>


    <script src="practica.js" defer></script>

</body>
</html>
