# Verificación automática del SGA en cada push y pull request:
#   - app: lint y build de Next.js.
#   - base: migraciones, seeds (dos veces) y tests SQL en un Postgres 16.
#   - e2e: la app contra una Supabase local (supabase start) con Playwright.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sga/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sga/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Valores de relleno: el build no se conecta a Supabase
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  base:
    name: Base de datos (migraciones, seeds y tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sga
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sga
    steps:
      - uses: actions/checkout@v4
      - run: bash sga/scripts/probar_base.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sga/app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (aplica las migraciones)
        working-directory: sga
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,storage-api
      - name: Seeds y usuarios demo
        run: bash sga/scripts/e2e_preparar.sh
        env:
          SUPABASE_CLI: supabase
      - run: npm ci
        working-directory: sga/app
      - run: npx playwright install --with-deps chromium
        working-directory: sga/app
      - run: npm run e2e
        working-directory: sga/app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sga/app/playwright-report
          retention-days: 7
