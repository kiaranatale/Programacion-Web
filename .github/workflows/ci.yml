# Verificación automática del SGA en cada push y pull request:
#   - app: lint y build de Next.js.
#   - base: migraciones, seeds (dos veces) y tests SQL en un Postgres 16.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sga/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sga/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Valores de relleno: el build no se conecta a Supabase
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  base:
    name: Base de datos (migraciones, seeds y tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sga
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sga
    steps:
      - uses: actions/checkout@v4
      - run: bash sga/scripts/probar_base.sh
